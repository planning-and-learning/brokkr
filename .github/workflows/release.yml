name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build_sdist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir build

      - name: Build source distribution
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v5
        with:
          name: sdist
          path: dist/*.tar.gz

  # pybrokkr is pure Python: one py3-none-any wheel instead of the cibuildwheel matrix.
  build_wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build frontend
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir build

      - name: Build wheel
        run: python -m build --wheel --outdir wheelhouse

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v5
        with:
          name: wheels-py3-none-any
          path: wheelhouse/*.whl

  github_release:
    needs:
      - build_sdist
      - build_wheel
    runs-on: ubuntu-latest

    if: github.repository_owner == 'verdog-ai'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version matches tag
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG=${GITHUB_REF#refs/tags/v}

          echo "Package version: $VERSION"
          echo "Git tag: $TAG"

          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch: pyproject.toml=$VERSION tag=$TAG"
            exit 1
          fi

      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Inspect release assets
        run: find dist -maxdepth 1 -type f

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes

  publish:
    needs: github_release
    runs-on: ubuntu-latest

    if: github.repository_owner == 'verdog-ai'

    permissions:
      id-token: write

    steps:
      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download source distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
